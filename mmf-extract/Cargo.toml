[package]
name = "mmf-extract"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
hound = "3.5"
png = "0.18.1"
sha2 = "0.11.1"

# The audio encoder is not a crate: `src/sound.rs` shells out to `ffmpeg`, which
# is the only FLAC encoder reachable from here and whose 16-bit support this
# project needs. See the module's note on why the Rust `flac` crate is not used.
