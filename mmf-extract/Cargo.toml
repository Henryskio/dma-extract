[package]
name = "mmf-extract"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
hound = "3.5"
png = "0.18.1"
sha2 = "0.11.1"

# The audio encoder is not a crate: the extractor shells out to the official
# `flac` tool (`apt install flac` / `brew install flac`), which keeps the source
# width -- an 8-bit file reports 16-bit when ffmpeg encodes it, so ffmpeg cannot
# be used here. This comment previously named ffmpeg, which the code has not
# shelled out to for a long time; see `lean/CORRECTIONS.md` §1.

[dev-dependencies]
# The parity test decodes both tools' PNGs back to pixels.
png = "0.18.1"
